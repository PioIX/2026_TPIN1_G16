<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <title>Ahorcado - Jugando</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body onload="prepareGame()">

    <div class="contenedor-vista">
        <a href="categorias.html" class="enlace-volver" title="Volver a categorías">
            <img src="img/flecha.png" alt="Flecha para volver atrás">
        </a>
        <h1 class="titulo-ahorcado">AHORCADO</h1>

        <div class="zona-ahorcado">
          <img src="img/6.png" alt="ahorcado" title="ahorcado" id="ahorcado">
        </div>

        <div class="zona-palabra">
          <p id="palabraEscondida"></p>
        </div>

        <div class="teclado">
            <div class="teclado-fila">
                <button class="tecla" id="A" onclick="checkLetter('A')">A</button>
                <button class="tecla" id="B" onclick="checkLetter('B')">B</button>
                <button class="tecla" id="C" onclick="checkLetter('C')">C</button>
                <button class="tecla" id="D" onclick="checkLetter('D')">D</button>
                <button class="tecla" id="E" onclick="checkLetter('E')">E</button>
                <button class="tecla" id="F" onclick="checkLetter('F')">F</button>
                <button class="tecla" id="G" onclick="checkLetter('G')">G</button>
                <button class="tecla" id="H" onclick="checkLetter('H')">H</button>
                <button class="tecla" id="I" onclick="checkLetter('I')">I</button>
            </div>
            <div class="teclado-fila">
                <button class="tecla" id="J" onclick="checkLetter('J')">J</button>
                <button class="tecla" id="K" onclick="checkLetter('K')">K</button>
                <button class="tecla" id="L" onclick="checkLetter('L')">L</button>
                <button class="tecla" id="M" onclick="checkLetter('M')">M</button>
                <button class="tecla" id="N" onclick="checkLetter('N')">N</button>
                <button class="tecla" id="Ñ" onclick="checkLetter('Ñ')">Ñ</button>
                <button class="tecla" id="O" onclick="checkLetter('O')">O</button>
                <button class="tecla" id="P" onclick="checkLetter('P')">P</button>
                <button class="tecla" id="Q" onclick="checkLetter('Q')">Q</button>
            </div>
            <div class="teclado-fila">
                <button class="tecla" id="R" onclick="checkLetter('R')">R</button>
                <button class="tecla" id="S" onclick="checkLetter('S')">S</button>
                <button class="tecla" id="T" onclick="checkLetter('T')">T</button>
                <button class="tecla" id="U" onclick="checkLetter('U')">U</button>
                <button class="tecla" id="V" onclick="checkLetter('V')">V</button>
                <button class="tecla" id="W" onclick="checkLetter('W')">W</button>
                <button class="tecla" id="X" onclick="checkLetter('X')">X</button>
                <button class="tecla" id="Y" onclick="checkLetter('Y')">Y</button>
                <button class="tecla" id="Z" onclick="checkLetter('Z')">Z</button>
            </div>
        </div>
    </div>
    <div id="modal" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-personalizado">
          <div class="modal-header modal-header-personalizado">
            <h5 class="modal-title titulo-modal" id="modalTitle"></h5>
            <button type="button" class="btn-close boton-cerrar-modal" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body modal-cuerpo">
            <p id="modalBody"></p>
          </div>
          <div class="modal-footer modal-footer-personalizado">
            <button type="button" class="boton-principal" data-bs-dismiss="modal">¡Listo!</button>
          </div>
        </div>
      </div>
    </div>
    
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script src="scripts/classes/Category.js"></script>
    <script src="scripts/classes/Player.js"></script>
    <script src="scripts/classes/Word.js"></script>
    <script src="scripts/classes/game.js"></script>
    <script src="scripts/requests.js"></script>
    <script src="scripts/dom.js"></script>
    <script src="scripts/logic.js"></script>
</body>
</html>

</body>
</html>
