<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <title>Ahorcado - Ranking</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body onload="iniciarRanking()">
  <div class="contenedor-vista-admin">
        <a href="categorias.html" class="enlace-volver" title="Volver a categorías">
            <img src="img/flecha.png" alt="Flecha para volver atrás">
        </a>
        <h1 class="titulo-ahorcado">RANKING</h1>
        <a onclick="modalReset()" class="btncostado admin" id="btnReset">Reiniciar</a>
  </div>

  <div class="tabla-contenedor">
    <table class="tabla" id="tablaRanking">
    </table>
  </div>


  <div id="modal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content modal-personalizado">
        <div class="modal-header modal-header-personalizado">
          <h5 class="modal-title titulo-modal" id="modalTitle"></h5>
          <button type="button" class="btn-close boton-cerrar-modal" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body modal-cuerpo">
          <p id="modalBody"></p>
        </div>
        <div class="modal-footer modal-footer-personalizado">
          <button type="button" class="boton-principal" data-bs-dismiss="modal">¡Listo!</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalReset" class="modal fade" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content modal-personalizado">
          <div class="modal-header modal-header-personalizado">
            <h5 class="modal-title titulo-modal" id="modalTitle">Reiniciar Ranking</h5>
            <button type="button" class="btn-close boton-cerrar-modal" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body modal-cuerpo">
            <p id="modalBody">¿Está seguro que desea reiniciar el ranking?</p>
          </div>
          <div class="modal-footer modal-footer-personalizado botones-modal">
            <button type="button" class="boton-principal" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="boton-principal" onclick="resetRanking()" data-bs-dismiss="modal">Reiniciar</button>
          </div>
        </div>
      </div>
    </div>
  
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"
  ></script>

  <script src="scripts/classes/Category.js"></script>
  <script src="scripts/classes/Player.js"></script>
  <script src="scripts/classes/Word.js"></script>
  <script src="scripts/classes/game.js"></script>
  <script src="scripts/requests.js"></script>
  <script src="scripts/dom.js"></script>
  <script src="scripts/logic.js"></script>
</body>
</html>
